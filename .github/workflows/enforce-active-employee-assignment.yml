name: Enforce active employee assignment

on:
  push:
    branches:
      - agent/gestao-funcionarios
    paths:
      - tools/enforce_active_employee_assignment.py
      - .github/workflows/enforce-active-employee-assignment.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/gestao-funcionarios
          fetch-depth: 0

      - name: Apply guarded fix
        run: python tools/enforce_active_employee_assignment.py

      - name: Validate HTML script syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="module">\s*(.*?)\s*</script>', html, flags=re.S)
          if not match:
              raise SystemExit('Module script not found')
          Path('/tmp/alfa-script.mjs').write_text(match.group(1), encoding='utf-8')
          PY
          node --check /tmp/alfa-script.mjs
          git diff --check

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "No index changes to commit."
            exit 0
          fi
          git config user.name "Alfa maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git commit -m "enforce active employee assignments"
          git push origin HEAD:agent/gestao-funcionarios

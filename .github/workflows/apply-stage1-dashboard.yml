name: Apply Stage 1 Dashboard

on:
  push:
    branches:
      - feature/dashboard-inicio-2026-08-24

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply dashboard patch
        run: python .github/scripts/apply_stage1_dashboard.py

      - name: Validate HTML and JavaScript
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          text = Path('index.html').read_text(encoding='utf-8')
          required = [
              'id="homeSection"',
              'id="viewHomeBtn"',
              'America/Sao_Paulo',
              'function renderHomeDashboard()',
              'ALFA-DEV: PAINEL INÍCIO / HOJE'
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'Elementos ausentes: {missing}')
          match = re.search(r'<script type="module">(.*?)</script>', text, re.S)
          if not match:
              raise SystemExit('Script module não encontrado')
          Path('/tmp/alfa-app.mjs').write_text(match.group(1), encoding='utf-8')
          print('Estrutura HTML validada.')
          PY
          node --check /tmp/alfa-app.mjs

      - name: Guard against new Firestore writes in dashboard
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('index.html').read_text(encoding='utf-8')
          start = text.index('function renderHomeDashboard()')
          end = text.index('\n\n    function setView(view)', start)
          block = text[start:end]
          forbidden = ['setDoc(', 'updateDoc(', 'addDoc(', 'deleteDoc(']
          found = [item for item in forbidden if item in block]
          if found:
              raise SystemExit(f'Escrita Firestore encontrada no dashboard: {found}')
          print('Dashboard confirmado como somente leitura.')
          PY

      - name: Commit final feature only
        shell: bash
        run: |
          git config user.name "Alfa maintenance bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git rm .github/scripts/apply_stage1_dashboard.py .github/workflows/apply-stage1-dashboard.yml
          git commit -m "feat: adiciona painel Inicio e corrige data local"
          git push

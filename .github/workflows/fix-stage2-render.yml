name: Fix stage 2 duplicate render

on:
  push:
    branches:
      - feature/acesso-compartilhado-performance-2026-08-25
    paths:
      - .github/workflows/fix-stage2-render.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/acesso-compartilhado-performance-2026-08-25
          fetch-depth: 0
      - name: Remove duplicate render
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old='''      const employeeButton = event.target.closest("[data-home-employee]");\n      if (employeeButton && isAdminUser()) {\n        selectEmployee(employeeButton.dataset.homeEmployee);\n        setView("tasks");\n      }'''
          new='''      const employeeButton = event.target.closest("[data-home-employee]");\n      if (employeeButton && isAdminUser()) {\n        selectEmployee(employeeButton.dataset.homeEmployee);\n      }'''
          if old not in s: raise SystemExit('trecho esperado não encontrado')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
          PY
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          Path('/tmp/check.mjs').write_text(m.group(1),encoding='utf-8')
          PY
          node --check /tmp/check.mjs
          rm -f .github/workflows/fix-stage2-render.yml
          git config user.name "alfa-stage2-bot"
          git config user.email "alfafiscalto@gmail.com"
          git add -A
          git commit -m "perf: evita render duplicado ao selecionar funcionário"
          git push origin HEAD:feature/acesso-compartilhado-performance-2026-08-25

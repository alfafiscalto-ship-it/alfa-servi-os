name: Apply shared access stage 2

on:
  push:
    branches:
      - feature/acesso-compartilhado-performance-2026-08-25
    paths:
      - .github/workflows/apply-access-shared.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/acesso-compartilhado-performance-2026-08-25
          fetch-depth: 0
      - name: Apply verified patch
        run: |
          python __apply_stage2.py
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('index.html').read_text(encoding='utf-8')
          m=re.search(r'<script type="module">(.*)</script>',s,re.S)
          if not m: raise SystemExit('script module não encontrado')
          Path('/tmp/alfa-check.mjs').write_text(m.group(1),encoding='utf-8')
          required=['Versão 1.8.0','OFFICE_LOGIN_EMAIL','let currentView = "home"','Senha do escritório']
          for item in required:
              if item not in s: raise SystemExit('faltando: '+item)
          forbidden=['allowedUserEmails','userProfiles','Restrito ao seu usuário']
          for item in forbidden:
              if item in s: raise SystemExit('legado ainda presente: '+item)
          PY
          node --check /tmp/alfa-check.mjs
      - name: Commit only final index
        run: |
          rm -f __apply_stage2.py
          rm -f .github/workflows/apply-access-shared.yml
          git config user.name "alfa-stage2-bot"
          git config user.email "alfafiscalto@gmail.com"
          git add -A
          git commit -m "feat: simplifica acesso e melhora desempenho do seletor"
          git push origin HEAD:feature/acesso-compartilhado-performance-2026-08-25

name: Update stage 2 documentation

on:
  push:
    branches:
      - docs/conclui-acesso-compartilhado-2026-08-25
    paths:
      - .github/workflows/update-stage2-docs.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/conclui-acesso-compartilhado-2026-08-25
          fetch-depth: 0
      - name: Update roadmap and context
        run: |
          python - <<'PY'
          from pathlib import Path

          roadmap = Path('EVOLUCAO_ALFA_SERVICOS.md')
          r = roadmap.read_text(encoding='utf-8')
          r = r.replace('> Última atualização: 24/08/2026 às 17:11 (America/Sao_Paulo).', '> Última atualização: 25/08/2026 (America/Sao_Paulo).')
          r = r.replace('''### Login\n\n**Firebase Authentication**\n\n- autenticação por e-mail e senha;\n- usuários existentes devem ser preservados;\n- problemas de frontend não justificam apagar ou recriar usuários.''', '''### Login\n\n**Firebase Authentication — acesso compartilhado**\n\n- o Firebase Authentication continua sendo a barreira técnica de segurança;\n- desde a versão `1.8.0`, o frontend usa uma única conta técnica do escritório: `alfafiscalto@gmail.com`;\n- a tela de login pede somente a senha do escritório;\n- funcionários não precisam mais possuir usuário próprio no Firebase;\n- a seleção de Henrique, David, Amanda, Flavia, Joyce, Julyana, Laila, Mariana ou Todos é operacional e acontece na interface;\n- usuários antigos do Authentication não foram apagados automaticamente e podem permanecer cadastrados;\n- nunca substituir essa simplificação por regras públicas de Firestore.''')
          r = r.replace('- usuários e perfis autorizados;\n- autenticação por e-mail e senha.', '- conta técnica compartilhada autorizada;\n- autenticação por e-mail e senha no Firebase, sem vínculo entre e-mail e funcionário.')

          marker = '''Validações realizadas:\n\n- sintaxe JavaScript validada com `node --check`;\n- verificação automática de que o bloco do dashboard não contém `setDoc`, `updateDoc`, `addDoc` ou `deleteDoc`;\n- teste determinístico da virada UTC x horário de São Paulo;\n- revisão do diff do PR;\n- automação visual por navegador não pôde ser executada porque o navegador disponível no ambiente bloqueou páginas locais por política administrativa.\n\n---\n\n# 7. ROADMAP OFICIAL'''
          insert = '''Validações realizadas:\n\n- sintaxe JavaScript validada com `node --check`;\n- verificação automática de que o bloco do dashboard não contém `setDoc`, `updateDoc`, `addDoc` ou `deleteDoc`;\n- teste determinístico da virada UTC x horário de São Paulo;\n- revisão do diff do PR;\n- automação visual por navegador não pôde ser executada porque o navegador disponível no ambiente bloqueou páginas locais por política administrativa.\n\n### Produção após a Etapa 2\n\nCommit funcional publicado:\n\n`37e53d951af321103a8cb18c62b2fe89aa8e8d6a`\n\nRollback preservado antes da Etapa 2:\n\n`backup/antes-acesso-compartilhado-2026-08-25`\n\nAlterações funcionais:\n\n- versão visual `1.8.0`;\n- login operacional simplificado para uma única conta técnica `alfafiscalto@gmail.com`;\n- frontend não mantém mais `allowedUserEmails` nem `userProfiles`;\n- funcionários deixaram de depender de e-mail próprio no Firebase;\n- qualquer pessoa com a senha do escritório pode selecionar qualquer funcionário pelo card lateral;\n- selecionar um nome abre a tela de tarefas já filtrada por esse responsável;\n- qualquer pessoa autenticada pode criar serviço para qualquer funcionário ativo e selecionar múltiplos responsáveis;\n- `Minha fila` vinculada ao usuário/e-mail foi removida da operação;\n- somente a view visível passa a ser renderizada;\n- fechamento do seletor ocorre antes da reconstrução do Kanban;\n- renderização é adiada para o frame seguinte ao fechar o seletor;\n- removidos renders duplicados e reconstruções desnecessárias;\n- blur global reduzido e o seletor de funcionário deixou de usar `backdrop-filter`, visando reduzir repaint/INP;\n- nenhuma coleção, campo ou documento foi migrado;\n- `firebaseConfig`, Storage e regras foram preservados;\n- Preview e produção Vercel confirmados com sucesso.\n\nDecisão importante de auditoria:\n\n- `createdBy` e `updatedBy` continuam existindo, mas passam a registrar a conta compartilhada do escritório, não a pessoa física que realizou a ação;\n- caso a Alfa queira identificação individual no futuro, isso deverá ser resolvido por uma camada operacional própria, sem voltar obrigatoriamente a criar um usuário Firebase para cada funcionário.\n\n---\n\n# 7. ROADMAP OFICIAL'''
          if marker not in r: raise SystemExit('roadmap marker not found')
          r = r.replace(marker, insert, 1)

          # Shift future headings from bottom to top.
          for old,new in [(10,11),(9,10),(8,9),(7,8),(6,7),(5,6),(4,5),(3,4)]:
              r = r.replace(f'## ETAPA {old} —', f'## ETAPA {new} —', 1)

          old_stage2 = '''## ETAPA 2 — Modo Lista de tarefas\n\n**Status: 🟡 APROVADA COMO PRÓXIMA ETAPA**'''
          new_stage2 = '''## ETAPA 2 — Acesso compartilhado + desempenho\n\n**Status: ✅ CONCLUÍDA em 25/08/2026**\n\n### Objetivo\n\nEliminar a necessidade de manter um usuário Firebase por funcionário e reduzir a sensação de travamento nas interações mais frequentes, sem abrir o Firestore ao público.\n\n### Implementado\n\n- uma única conta técnica do escritório no Firebase Authentication;\n- login visual solicita apenas a senha do escritório;\n- removidos vínculos `e-mail -> funcionário` do frontend;\n- todos podem selecionar qualquer funcionário pelo card lateral;\n- a seleção abre diretamente as tarefas daquele responsável;\n- todos podem criar serviços para qualquer funcionário ativo;\n- múltiplos responsáveis continuam suportados;\n- funcionários inativos continuam disponíveis apenas no histórico;\n- painel e filtros usam o funcionário selecionado, não o e-mail autenticado;\n- renderização restrita à view aberta;\n- redução de renders duplicados;\n- seletor fecha antes do Kanban ser reconstruído;\n- render pós-seleção usa `requestAnimationFrame`;\n- modal do seletor deixou de usar blur de fundo;\n- blur global reduzido de 22px para 14px;\n- versão visual `1.8.0`.\n\n### Segurança e compatibilidade\n\n- Firebase Authentication NÃO foi removido;\n- Firestore NÃO foi aberto para acesso público;\n- `firebaseConfig` preservado;\n- coleções `tarefas`, `clientes` e `funcionarios` preservadas;\n- campos `employee` e `assignees` preservados;\n- usuários antigos do Firebase não foram apagados;\n- nenhuma tarefa antiga foi migrada ou regravada apenas por causa da mudança de acesso.\n\n### Auditoria\n\nCom a conta compartilhada, `createdBy` e `updatedBy` identificam a conta técnica do escritório. Eles não identificam qual funcionário estava fisicamente usando o navegador.\n\n### Publicação\n\n- rollback: `backup/antes-acesso-compartilhado-2026-08-25`;\n- PR: `#5`;\n- commit funcional: `37e53d951af321103a8cb18c62b2fe89aa8e8d6a`;\n- Preview Vercel: sucesso;\n- produção Vercel: sucesso.\n\n---\n\n## ETAPA 3 — Modo Lista de tarefas\n\n**Status: 🟡 APROVADA COMO PRÓXIMA ETAPA**'''
          if old_stage2 not in r: raise SystemExit('stage2 heading not found')
          r = r.replace(old_stage2, new_stage2, 1)

          old_table = '''| Ordem | Etapa | Status | Risco estimado |\n|---|---|---|---|\n| 0 | Base segura de manutenção | ✅ Concluída | Muito baixo |\n| 1 | Painel Início / Hoje | ✅ Concluída | Muito baixo |\n| 2 | Modo Lista | 🟡 Próxima | Baixo |\n| 3 | Ficha operacional do cliente | ⚪ Planejada | Baixo |\n| 4 | Calendário / prazos | ⚪ Planejada | Baixo |\n| 5 | Relatórios por pedido/prazo | ⚪ Planejada | Baixo |\n| 6 | Busca global | ⚪ Planejada | Baixo |\n| 7 | Administração organizada | ⚪ Planejada | Médio |\n| 8 | Anexos / Storage | ⚠️ Planejada | Médio |\n| 9 | Limpeza gradual da arquitetura | ⚪ Planejada | Médio |\n| 10 | Gestão avançada | 🔵 Futura | Avaliar caso a caso |'''
          new_table = '''| Ordem | Etapa | Status | Risco estimado |\n|---|---|---|---|\n| 0 | Base segura de manutenção | ✅ Concluída | Muito baixo |\n| 1 | Painel Início / Hoje | ✅ Concluída | Muito baixo |\n| 2 | Acesso compartilhado + desempenho | ✅ Concluída | Baixo |\n| 3 | Modo Lista | 🟡 Próxima | Baixo |\n| 4 | Ficha operacional do cliente | ⚪ Planejada | Baixo |\n| 5 | Calendário / prazos | ⚪ Planejada | Baixo |\n| 6 | Relatórios por pedido/prazo | ⚪ Planejada | Baixo |\n| 7 | Busca global | ⚪ Planejada | Baixo |\n| 8 | Administração organizada | ⚪ Planejada | Médio |\n| 9 | Anexos / Storage | ⚠️ Planejada | Médio |\n| 10 | Limpeza gradual da arquitetura | ⚪ Planejada | Médio |\n| 11 | Gestão avançada | 🔵 Futura | Avaliar caso a caso |'''
          if old_table not in r: raise SystemExit('roadmap table not found')
          r = r.replace(old_table, new_table, 1)
          r = r.replace('Para anexos, quando a Etapa 8 existir de fato, acrescentar:', 'Para anexos, quando a Etapa 9 existir de fato, acrescentar:')
          r = r.replace('**Implementar a ETAPA 2 — Modo Lista de tarefas, preservando o Kanban e reutilizando os mesmos objetos `tasks` já carregados.**', '**Implementar a ETAPA 3 — Modo Lista de tarefas, preservando o Kanban e reutilizando os mesmos objetos `tasks` já carregados.**')
          r = r.replace('A importação de backup grava no Firestore e deve continuar protegida e claramente diferenciada das funções operacionais.', 'A importação de backup grava no Firestore e deve continuar protegida e claramente diferenciada das funções operacionais. Na versão 1.8.0 a sessão compartilhada ainda possui as ferramentas administrativas existentes; uma separação futura pode usar no máximo uma credencial administrativa adicional, sem voltar ao modelo de um usuário por funcionário.')
          roadmap.write_text(r, encoding='utf-8')

          context = Path('CONTEXTO_SISTEMA_ALFA.md')
          c = context.read_text(encoding='utf-8')
          c = c.replace('> Última atualização: 24/08/2026 às 17:11 (America/Sao_Paulo).', '> Última atualização: 25/08/2026 (America/Sao_Paulo).')
          c = c.replace('> Fonte técnica desta revisão: `index.html` anexado na conversa em 24/08/2026 e confirmado como idêntico ao `index.html` do branch `main` no momento do baseline.', '> Fonte técnica da revisão funcional 1.8.0: `index.html` anexado em 25/08/2026, confirmado como idêntico ao blob `aad4083fc0d71e77eefebfa55c2df74fe2c18479` do `main` antes da alteração.')
          c = c.replace('''- Release funcional atual após a Etapa 1:\n  - versão visual: `1.7.0`;\n  - commit funcional: `5ac984554f046ba68e62da923e7ea72ff3cb6097`;\n  - rollback anterior à Etapa 1: `backup/antes-dashboard-inicio-2026-08-24`.''', '''- Release funcional atual após a Etapa 2:\n  - versão visual: `1.8.0`;\n  - commit funcional: `37e53d951af321103a8cb18c62b2fe89aa8e8d6a`;\n  - rollback anterior à Etapa 2: `backup/antes-acesso-compartilhado-2026-08-25`.''')
          c = c.replace('''### Firebase Authentication\n- Responsável pelo login com e-mail e senha.\n- O frontend mantém uma lista local de e-mails autorizados e perfis.\n- Essa lista local NÃO substitui o Authentication nem as regras de segurança do Firestore.\n- Não apagar ou recriar usuários para corrigir problemas de frontend.''', '''### Firebase Authentication\n- Continua responsável pela barreira de entrada do sistema.\n- Desde a versão `1.8.0`, o frontend usa uma única conta técnica: `alfafiscalto@gmail.com`.\n- A interface pede apenas a senha do escritório; o e-mail técnico fica fixo no código.\n- Não existe mais vínculo entre e-mail Firebase e funcionário.\n- Funcionários são selecionados operacionalmente pelo card lateral.\n- Usuários antigos do Firebase Authentication não foram apagados automaticamente e não são necessários para a operação diária do frontend 1.8.0.\n- Não abrir regras do Firestore para substituir o Authentication.''')
          c = c.replace('''### Usuários e perfis\n- `allowedUserEmails`: autorização adicional no frontend.\n- `userProfiles`: nome, perfil e vínculo com funcionário.\n- Alterações futuras em acesso devem ser coordenadas com Authentication e regras, quando expressamente autorizadas.''', '''### Acesso compartilhado\n- `OFFICE_LOGIN_EMAIL`: conta técnica fixa usada pelo frontend.\n- `SHARED_ACCESS_PROFILE`: perfil operacional compartilhado.\n- `allowedUserEmails` e `userProfiles` foram removidos na versão 1.8.0.\n- Todos os usuários que conhecem a senha do escritório entram na mesma sessão técnica e podem selecionar qualquer funcionário.\n- O seletor de funcionário define o recorte operacional das tarefas; ele não altera a identidade do Firebase.\n- Todos podem criar serviços para qualquer funcionário ativo e selecionar múltiplos responsáveis.''')
          c = c.replace('- Administradores também recebem resumo por responsável.', '- A sessão compartilhada recebe o resumo por responsável.')
          c = c.replace('- painel **Início / Hoje** como primeira tela pós-login;\n- indicadores derivados de vencimento, hoje, próximos 3 dias, alta prioridade e andamento;\n- resumo operacional da equipe para administradores;\n- visão `Minha fila` quando o perfil administrativo corresponde a funcionário existente;\n- data operacional calculada em `America/Sao_Paulo`;\n- restrição adicional de e-mails no frontend;', '- painel **Início / Hoje** como primeira tela pós-login;\n- indicadores derivados de vencimento, hoje, próximos 3 dias, alta prioridade e andamento;\n- resumo operacional da equipe no acesso compartilhado;\n- seleção operacional de funcionário pelo card lateral;\n- data operacional calculada em `America/Sao_Paulo`;\n- acesso compartilhado por uma única conta técnica do Firebase;')
          c = c.replace('- restrição de visualização para usuário não administrador conforme perfil local;', '- todos os usuários da sessão compartilhada podem visualizar tarefas de qualquer funcionário e criar serviços para qualquer responsável ativo;')

          marker2 = '''**Partes NÃO alteradas**\n- coleções, documentos e campos do Firestore;\n- `firebaseConfig`;\n- Authentication;\n- Storage e suas regras;\n- valores dos status existentes;\n- estrutura base do Kanban, Clientes, Relatórios e Equipe.\n\n---\n\n## 5. Decisões técnicas permanentes'''
          insert2 = '''**Partes NÃO alteradas**\n- coleções, documentos e campos do Firestore;\n- `firebaseConfig`;\n- Authentication;\n- Storage e suas regras;\n- valores dos status existentes;\n- estrutura base do Kanban, Clientes, Relatórios e Equipe.\n\n---\n\n### 25/08/2026 — Etapa 2: Acesso compartilhado + desempenho\n**Objetivo:** simplificar o uso diário eliminando a necessidade de um usuário Firebase por funcionário e reduzir atrasos de interação observados no seletor de funcionário.\n\n**Solução aplicada**\n- versão visual `1.8.0`;\n- conta técnica única `alfafiscalto@gmail.com`;\n- tela de login passou a pedir somente a senha do escritório;\n- removidos `allowedUserEmails` e `userProfiles`;\n- funcionário deixou de ser inferido pelo e-mail autenticado;\n- todos podem selecionar qualquer funcionário ou Todos;\n- ao escolher um funcionário, o sistema fecha o seletor e abre as tarefas filtradas por aquele nome;\n- todos podem atribuir novos serviços a qualquer funcionário ativo e manter múltiplos responsáveis;\n- `Minha fila` vinculada a e-mail foi desativada;\n- `render()` passou a atualizar apenas a view atualmente visível;\n- removidas reconstruções redundantes do Kanban, Dashboard, equipe e seletor;\n- seleção usa `requestAnimationFrame` depois do fechamento do modal;\n- blur global reduzido e modal do seletor sem `backdrop-filter`.\n\n**Publicação**\n- rollback: `backup/antes-acesso-compartilhado-2026-08-25`;\n- PR: `#5`;\n- commit funcional: `37e53d951af321103a8cb18c62b2fe89aa8e8d6a`;\n- Preview Vercel: sucesso;\n- produção Vercel: sucesso.\n\n**Validação**\n- arquivo anexado confirmado idêntico ao `main` antes da mudança;\n- JavaScript validado com `node --check`;\n- diff final contém somente `index.html`;\n- nenhuma escrita de teste foi realizada no Firestore;\n- melhoria foi direcionada ao INP observado no seletor, mas o ganho real deve continuar sendo acompanhado no uso normal da equipe.\n\n**Ponto de auditoria**\n- `createdBy` e `updatedBy` passam a identificar a conta técnica compartilhada, não a pessoa que estava usando o computador;\n- se identificação individual voltar a ser necessária, criar uma camada operacional específica sem obrigar um usuário Firebase por funcionário.\n\n---\n\n## 5. Decisões técnicas permanentes'''
          if marker2 not in c: raise SystemExit('context log marker not found')
          c = c.replace(marker2, insert2, 1)
          c = c.replace('18. Novas funcionalidades não devem ser misturadas com refatorações estéticas não relacionadas.', '18. Novas funcionalidades não devem ser misturadas com refatorações estéticas não relacionadas.\n19. O modelo operacional atual usa uma única conta técnica Firebase e seleção de funcionário na interface.\n20. Simplificar login nunca autoriza abrir regras do Firestore para o público.\n21. A conta compartilhada não fornece auditoria individual por pessoa física.')
          c = c.replace('''### Autorização\n- Existem duas camadas visíveis no frontend: `allowedUserEmails` e `userProfiles`.\n- As regras reais de acesso também dependem do Firebase.\n- Evitar mudanças parciais que deixem frontend e backend inconsistentes.''', '''### Autorização / acesso compartilhado\n- `allowedUserEmails` e `userProfiles` não existem mais no frontend 1.8.0.\n- A conta técnica `alfafiscalto@gmail.com` continua autenticada pelo Firebase Authentication.\n- As regras do Firestore continuam sendo a proteção do backend e não devem ser abertas.\n- Funcionário selecionado no card é apenas um filtro operacional, não uma identidade de segurança.\n- Usuários Firebase antigos podem permanecer cadastrados, mas o frontend diário não depende deles.\n\n### Auditoria por usuário\n- Tarefas continuam gravando `createdBy` e `updatedBy`.\n- Com login compartilhado, esses campos registram `alfafiscalto@gmail.com` e não distinguem Henrique, David, Flavia etc.\n- Não interpretar esses campos como identificação individual enquanto o modelo compartilhado estiver ativo.''')
          c = c.replace('''### Backup JSON\n- A importação escreve no Firestore.\n- Deve permanecer administrativa.\n- Não confundir rollback de código (Git) com restauração de dados (JSON).''', '''### Backup JSON\n- A importação escreve no Firestore.\n- Deve permanecer uma operação de alto cuidado.\n- Na versão 1.8.0, a mesma sessão compartilhada ainda enxerga as ferramentas administrativas existentes.\n- Se o escritório quiser separar operação e administração no futuro, usar uma credencial administrativa adicional é preferível a voltar ao modelo de um login por funcionário.\n- Não confundir rollback de código (Git) com restauração de dados (JSON).''')
          context.write_text(c, encoding='utf-8')

          print('documentation updated')
          PY
          grep -q 'ETAPA 2 — Acesso compartilhado + desempenho' EVOLUCAO_ALFA_SERVICOS.md
          grep -q 'ETAPA 3 — Modo Lista de tarefas' EVOLUCAO_ALFA_SERVICOS.md
          grep -q 'versão visual `1.8.0`' CONTEXTO_SISTEMA_ALFA.md
          grep -q 'createdBy' CONTEXTO_SISTEMA_ALFA.md
      - name: Commit documentation only
        run: |
          rm -f .github/workflows/update-stage2-docs.yml
          git config user.name "alfa-docs-bot"
          git config user.email "alfafiscalto@gmail.com"
          git add -A
          git commit -m "docs: registra acesso compartilhado e nova Etapa 3"
          git push origin HEAD:docs/conclui-acesso-compartilhado-2026-08-25

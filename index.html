<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Alfa Contabilidade | Sistema de Serviços</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07070b;
      --bg-soft: #11111a;
      --panel: rgba(20, 20, 31, 0.72);
      --panel-strong: rgba(28, 28, 42, 0.86);
      --border: rgba(255, 255, 255, 0.11);
      --border-strong: rgba(255, 255, 255, 0.2);
      --text: #f8fafc;
      --muted: #a7adbb;
      --muted-2: #757b8c;
      --red: #e50914;
      --red-2: #ff3140;
      --red-dark: #8b0008;
      --green: #22c55e;
      --yellow: #f59e0b;
      --blue: #38bdf8;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
      --radius-xl: 28px;
      --radius-lg: 20px;
      --blur: blur(22px);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 12%, rgba(229, 9, 20, 0.32), transparent 28%),
        radial-gradient(circle at 88% 18%, rgba(255, 49, 64, 0.18), transparent 24%),
        linear-gradient(135deg, #050508 0%, #0b0b12 42%, #13080b 100%);
      overflow-x: hidden;
    }

    /* --- ESTILOS DE LOGIN E INTERFACE --- */
    .login-screen {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .login-card {
      width: min(460px, 100%);
      padding: 30px;
      border-radius: 32px;
      background: var(--panel);
      border: 1px solid var(--border);
      backdrop-filter: var(--blur);
      box-shadow: var(--shadow);
    }
    .login-logo {
      width: 62px; height: 62px;
      border-radius: 20px;
      background: linear-gradient(145deg, var(--red), var(--red-2));
      display: grid; place-items: center;
      font-weight: 900; font-size: 24px;
      margin-bottom: 18px;
    }
    .login-card h1 { margin: 0; font-size: 32px; }
    .login-card p { margin: 12px 0 22px; color: var(--muted); font-size: 14px; }
    
    .field { position: relative; margin-bottom: 12px; }
    .field label {
      display: block; margin-bottom: 7px;
      color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase;
    }
    .field input, .field select, .field textarea {
      width: 100%; border: 1px solid var(--border); border-radius: 16px;
      padding: 13px 14px; background: rgba(255,255,255,0.07);
      color: var(--text); font-size: 14px; outline: none;
    }
    .field textarea { min-height: 106px; resize: vertical; }
    .field select option { color: #111827; }

    .btn {
      border: 0; border-radius: 16px; padding: 12px 15px;
      color: var(--text); font-size: 13px; font-weight: 800;
      cursor: pointer; display: inline-flex; gap: 8px; align-items: center; justify-content: center;
      transition: 180ms ease; width: 100%;
    }
    .btn-primary { background: linear-gradient(135deg, var(--red), var(--red-2)); }
    .btn-secondary { background: rgba(255,255,255,0.075); border: 1px solid var(--border); width: auto; }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.08); }

    .app-shell {
      width: min(1480px, calc(100% - 32px));
      margin: 0 auto; padding: 28px 0 42px;
      display: none; grid-template-columns: 300px 1fr; gap: 22px;
    }
    .app-shell.visible { display: grid; }
    
    .sidebar {
      position: sticky; top: 24px; height: calc(100vh - 48px);
      border-radius: var(--radius-xl); padding: 22px;
      background: var(--panel); border: 1px solid var(--border);
      display: flex; flex-direction: column; overflow: hidden;
    }
    .brand { display: flex; gap: 14px; align-items: center; padding-bottom: 22px; border-bottom: 1px solid var(--border); }
    .brand-mark {
      width: 48px; height: 48px; border-radius: 16px;
      background: linear-gradient(145deg, var(--red), var(--red-2));
      display: grid; place-items: center; font-weight: 900;
    }
    .brand h1 { margin: 0; font-size: 16px; }
    .brand span { display: block; color: var(--muted); font-size: 12px; }

    .nav-title { margin: 22px 0 10px; color: var(--muted-2); font-size: 11px; text-transform: uppercase; font-weight: 800; }
    .employee-list {
      display: grid; gap: 10px; overflow-y: auto; padding-right: 8px; flex: 1;
    }
    .employee-btn {
      width: 100%; padding: 12px 13px; border: 1px solid transparent; border-radius: 16px;
      color: var(--text); background: rgba(255, 255, 255, 0.035);
      display: flex; justify-content: space-between; cursor: pointer; text-align: left;
    }
    .employee-btn.active, .employee-btn:hover { background: rgba(255, 255, 255, 0.085); border-color: var(--border-strong); }
    .employee-name { font-weight: 700; }
    
    .main { min-width: 0; }
    .topbar {
      border-radius: var(--radius-xl); padding: 20px; background: var(--panel); border: 1px solid var(--border);
      display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; margin-bottom: 20px;
    }
    .topbar h2 { margin: 0; font-size: 28px; }
    .topbar p { margin: 5px 0 0; color: var(--muted); font-size: 14px; }
    .actions { display: flex; gap: 10px; flex-wrap: wrap; }

    .board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .column { min-height: 480px; border: 1px solid var(--border); border-radius: var(--radius-xl); background: rgba(255,255,255,0.045); overflow: hidden; padding: 15px;}
    .column-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; border-bottom: 1px solid var(--border); padding-bottom: 10px;}
    
    .task-card {
      border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 14px;
      background: rgba(13, 13, 21, 0.74); margin-bottom: 10px; transition: 160ms ease;
    }
    .task-card:hover { border-color: var(--border-strong); transform: translateY(-2px); }
    .task-card.overdue { border-color: var(--red); box-shadow: 0 0 15px rgba(229, 9, 20, 0.2); }
    .task-header { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 12px; color: var(--muted); }
    .task-title { font-size: 15px; font-weight: 700; margin: 0 0 8px; }
    .task-info { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .task-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
    .task-actions button {
      background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 8px;
      padding: 6px 10px; color: var(--text); font-size: 11px; cursor: pointer;
    }
    .task-actions button:hover { background: rgba(255,255,255,0.1); }
    
    .attachments-list { margin-top: 8px; display: flex; flex-direction: column; gap: 5px; }
    .attachment-link { font-size: 11px; color: var(--blue); text-decoration: none; word-break: break-all; }
    .attachment-link:hover { text-decoration: underline; }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
      z-index: 100; display: none; place-items: center; padding: 20px; overflow-y: auto;
    }
    .modal.open { display: grid; }
    .modal-card {
      background: var(--panel-strong); border: 1px solid var(--border);
      border-radius: var(--radius-xl); width: min(600px, 100%); padding: 30px;
      box-shadow: var(--shadow); position: relative;
    }
    .modal-close {
      position: absolute; top: 20px; right: 20px; background: transparent; border: 0;
      color: var(--muted); font-size: 24px; cursor: pointer;
    }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-grid .full { grid-column: 1 / -1; }

    .toast {
      position: fixed; right: 22px; bottom: 22px; background: var(--panel-strong);
      border: 1px solid var(--border); border-radius: 16px; padding: 16px 20px;
      color: var(--text); font-size: 14px; z-index: 999; display: none;
    }
    
    .login-version-badge {
      position: fixed; right: 22px; bottom: 18px; z-index: 3; padding: 10px 13px;
      border-radius: 16px; border: 1px solid rgba(255,255,255,0.14);
      background: rgba(15,15,24,0.68); color: var(--muted); font-size: 11px; text-align: right;
    }
    .login-version-badge strong { display: block; color: var(--text); font-size: 12px; }
  </style>
</head>
<body>

  <div class="login-screen" id="loginScreen">
    <div class="login-card">
      <div class="login-logo">A</div>
      <h1>Entrar</h1>
      <p>Acesso restrito à equipe Alfa Contabilidade</p>
      <form id="loginForm">
        <div class="field">
          <label>E-mail</label>
          <input type="email" id="emailInput" required />
        </div>
        <div class="field">
          <label>Senha</label>
          <input type="password" id="passwordInput" required />
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Entrar no sistema</button>
      </form>
    </div>
    <div class="login-version-badge">
      <strong>Versão 1.4</strong>
      Sistema criado por David Moretti Ferreira
    </div>
  </div>

  <div class="app-shell" id="appShell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">A</div>
        <div>
          <h1>Alfa Contabilidade</h1>
          <span id="currentUserEmail">-</span>
        </div>
      </div>
      <div class="nav-title">Funcionários</div>
      <div class="employee-list" id="employeeList">
        </div>
      <button class="btn btn-secondary" id="logoutBtn" style="margin-top: auto;">Sair do sistema</button>
    </aside>

    <main class="main">
      <section class="topbar">
        <div>
          <h2 id="pageTitle">Serviços da equipe</h2>
          <p id="pageSubtitle">Acompanhe os serviços solicitados.</p>
        </div>
        <div class="actions">
          <button class="btn btn-secondary" id="resetPasswordBtn" type="button">Alterar senha</button>
          <button class="btn btn-primary" id="openModalBtn" type="button">+ Novo serviço</button>
        </div>
      </section>

      <section class="board" id="tasksBoard">
        <div class="column">
          <div class="column-header"><strong>Pendente</strong> <span id="countPendente">0</span></div>
          <div id="colPendente"></div>
        </div>
        <div class="column">
          <div class="column-header"><strong>Em andamento</strong> <span id="countAndamento">0</span></div>
          <div id="colAndamento"></div>
        </div>
        <div class="column">
          <div class="column-header"><strong>Concluído</strong> <span id="countConcluido">0</span></div>
          <div id="colConcluido"></div>
        </div>
      </section>
    </main>
  </div>

  <div class="modal" id="taskModal">
    <div class="modal-card">
      <button class="modal-close" id="closeModalBtn">&times;</button>
      <h2 id="modalTitle" style="margin-top: 0;">Novo serviço</h2>
      <form id="taskForm">
        <input type="hidden" id="taskId" name="taskId" />
        <div class="form-grid">
          <div class="field full">
            <label>Funcionário Responsável</label>
            <select name="employee" id="employeeInput" required></select>
          </div>
          <div class="field">
            <label>Data do pedido</label>
            <input type="date" name="requestDate" id="requestDateInput" required />
          </div>
          <div class="field">
            <label>Prazo Limite</label>
            <input type="date" name="deadline" id="deadlineInput" required />
          </div>
          <div class="field full">
            <label>Cliente / Empresa</label>
            <input type="text" name="client" id="clientInput" required placeholder="Digite o nome do cliente" />
          </div>
          <div class="field full">
            <label>Tipo de Serviço</label>
            <input type="text" name="serviceType" id="serviceTypeInput" required placeholder="Ex: Alteração Contratual" />
          </div>
          <div class="field full">
            <label>Descrição</label>
            <textarea name="description" id="descriptionInput" required placeholder="Detalhes do que deve ser feito..."></textarea>
          </div>
          <div class="field">
            <label>Prioridade</label>
            <select name="priority" id="priorityInput">
              <option value="baixa">Baixa</option>
              <option value="media" selected>Média</option>
              <option value="alta">Alta</option>
            </select>
          </div>
          <div class="field">
            <label>Anexos (PDF, Imagens)</label>
            <input type="file" id="attachmentsInput" multiple accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg,.xml,.txt" />
          </div>
          <div class="field full">
            <label>Observação Interna</label>
            <textarea name="notes" id="notesInput" placeholder="Anotações extras..."></textarea>
          </div>
        </div>
        <button type="submit" class="btn btn-primary" id="saveTaskBtn" style="margin-top: 15px;">Salvar serviço</button>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

    // MANTENHA SUAS CREDENCIAIS AQUI
    const firebaseConfig = {
      apiKey: "AIzaSyCMLD4nzWvBzL7WHbQnGVl2a3sFmC7WmsY",
      authDomain: "alfa-work-b8ace.firebaseapp.com",
      projectId: "alfa-work-b8ace",
      storageBucket: "alfa-work-b8ace.firebasestorage.app",
      messagingSenderId: "480744432593",
      appId: "1:480744432593:web:fe5d889aee08000417b6f0"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const employees = [
      { email: "alfafiscalto@gmail.com", name: "Henrique", role: "Administrador" },
      { email: "alfacontabilidade2014@gmail.com", name: "Henrique", role: "Administrador" },
      { email: "rebcaravila@gmail.com", name: "Rebeca", role: "Funcionária" },
      { email: "morettidavid20@gmail.com", name: "David", role: "Funcionário" },
      { email: "jhempreendimentos93@gmail.com", name: "Amanda", role: "Funcionária" },
      { email: "flaviarodriguessoltu92@gmail.com", name: "Flavia", role: "Funcionária" },
      { email: "joycealmeidabrito01@gmail.com", name: "Joyce", role: "Funcionária" },
      { email: "julyanarocha@unitins.br", name: "Julyana", role: "Funcionária" }
    ];

    let currentUser = null;
    let isAdmin = false;
    let selectedEmployeeFilter = "Todos";
    let tasks = [];
    let unsubscribeTasks = null;

    // Utilitários
    const showToast = (msg) => {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.style.display = "block";
      setTimeout(() => toast.style.display = "none", 4000);
    };

    const getToday = () => new Date().toISOString().split("T")[0];

    // Auth
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        const profile = employees.find(e => e.email === user.email);
        isAdmin = profile ? profile.role === "Administrador" : false;
        document.getElementById("currentUserEmail").textContent = user.email;
        
        selectedEmployeeFilter = isAdmin ? "Todos" : profile.name;
        
        document.getElementById("loginScreen").style.display = "none";
        document.getElementById("appShell").classList.add("visible");
        
        buildEmployeeSelect();
        buildSidebarEmployees();
        listenTasks();
      } else {
        document.getElementById("loginScreen").style.display = "grid";
        document.getElementById("appShell").classList.remove("visible");
        if(unsubscribeTasks) unsubscribeTasks();
      }
    });

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginBtn");
      btn.textContent = "Aguarde...";
      try {
        await signInWithEmailAndPassword(auth, document.getElementById("emailInput").value, document.getElementById("passwordInput").value);
      } catch (error) {
        showToast("Erro ao logar. Verifique e-mail e senha.");
        btn.textContent = "Entrar no sistema";
      }
    });

    document.getElementById("logoutBtn").addEventListener("click", () => signOut(auth));
    document.getElementById("resetPasswordBtn").addEventListener("click", () => {
      if (currentUser) {
        sendPasswordResetEmail(auth, currentUser.email).then(() => showToast("E-mail de redefinição enviado!")).catch(e => showToast("Erro: " + e.message));
      }
    });

    // Sidebar & Select
    function buildEmployeeSelect() {
      const select = document.getElementById("employeeInput");
      select.innerHTML = "";
      // Todos os funcionários na lista
      const names = [...new Set(employees.filter(e => e.name !== "Henrique").map(e => e.name))];
      names.forEach(name => {
        const opt = document.createElement("option");
        opt.value = name; opt.textContent = name;
        select.appendChild(opt);
      });
    }

    function buildSidebarEmployees() {
      const list = document.getElementById("employeeList");
      list.innerHTML = "";
      
      if (isAdmin) {
        const btnAll = document.createElement("button");
        btnAll.className = `employee-btn ${selectedEmployeeFilter === "Todos" ? "active" : ""}`;
        btnAll.innerHTML = `<span class="employee-name">Todos os Serviços</span>`;
        btnAll.onclick = () => { selectedEmployeeFilter = "Todos"; buildSidebarEmployees(); renderTasks(); };
        list.appendChild(btnAll);
      }

      const names = [...new Set(employees.filter(e => e.name !== "Henrique").map(e => e.name))];
      names.forEach(name => {
        // Se não for admin, só mostra o próprio nome
        if (!isAdmin && name !== selectedEmployeeFilter) return;

        const btn = document.createElement("button");
        btn.className = `employee-btn ${selectedEmployeeFilter === name ? "active" : ""}`;
        btn.innerHTML = `<span class="employee-name">${name}</span>`;
        btn.onclick = () => { selectedEmployeeFilter = name; buildSidebarEmployees(); renderTasks(); };
        list.appendChild(btn);
      });
    }

    // Leitura Simples do Firestore
    function listenTasks() {
      unsubscribeTasks = onSnapshot(collection(db, "tarefas"), (snapshot) => {
        let loadedTasks = [];
        snapshot.forEach((doc) => {
          loadedTasks.push({ id: doc.id, ...doc.data() });
        });
        
        // Ordena por data no JS para não exigir Índice do Firestore
        loadedTasks.sort((a, b) => {
          const aTime = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
          const bTime = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
          return bTime - aTime;
        });

        tasks = loadedTasks;
        renderTasks();
      }, (error) => {
        showToast("Erro ao carregar tarefas. Pressione Ctrl + F5.");
        console.error(error);
      });
    }

    function renderTasks() {
      const colPen = document.getElementById("colPendente");
      const colAnd = document.getElementById("colAndamento");
      const colCon = document.getElementById("colConcluido");
      
      colPen.innerHTML = ""; colAnd.innerHTML = ""; colCon.innerHTML = "";
      let countP = 0, countA = 0, countC = 0;

      tasks.forEach(task => {
        // Filtro de visualização (Admin vê todos, funcionário vê os seus)
        if (selectedEmployeeFilter !== "Todos" && task.employee !== selectedEmployeeFilter) return;

        const card = document.createElement("div");
        card.className = "task-card " + (task.deadline < getToday() && task.status !== "concluido" ? "overdue" : "");
        
        let attachmentsHTML = "";
        if (task.attachments && task.attachments.length > 0) {
          attachmentsHTML = `<div class="attachments-list">` + 
            task.attachments.map(a => `<a href="${a.url}" target="_blank" class="attachment-link">📎 ${a.name}</a>`).join("") +
          `</div>`;
        }

        card.innerHTML = `
          <div class="task-header">
            <span>👤 ${task.employee}</span>
            <span style="color: var(--${task.priority === 'alta' ? 'red' : task.priority === 'media' ? 'yellow' : 'green'})">🔥 ${task.priority.toUpperCase()}</span>
          </div>
          <h3 class="task-title">${task.client}</h3>
          <div class="task-info"><strong>Serviço:</strong> ${task.serviceType}</div>
          <div class="task-info"><strong>Prazo:</strong> ${task.deadline.split("-").reverse().join("/")}</div>
          ${attachmentsHTML}
          <div class="task-actions">
            <button onclick="editTask('${task.id}')">✏️ Editar</button>
            ${task.status === "pendente" ? `<button onclick="changeStatus('${task.id}', 'andamento')">▶️ Iniciar</button>` : ""}
            ${task.status === "andamento" ? `<button onclick="changeStatus('${task.id}', 'concluido')">✅ Concluir</button>` : ""}
            ${task.status === "concluido" ? `<button onclick="changeStatus('${task.id}', 'andamento')">🔄 Reabrir</button>` : ""}
            ${isAdmin ? `<button onclick="deleteTask('${task.id}')" style="color:var(--red);">🗑️ Excluir</button>` : ""}
          </div>
        `;

        if (task.status === "pendente") { colPen.appendChild(card); countP++; }
        else if (task.status === "andamento") { colAnd.appendChild(card); countA++; }
        else { colCon.appendChild(card); countC++; }
      });

      document.getElementById("countPendente").textContent = countP;
      document.getElementById("countAndamento").textContent = countA;
      document.getElementById("countConcluido").textContent = countC;
    }

    // Ações de Tarefas
    window.changeStatus = async (id, newStatus) => {
      await updateDoc(doc(db, "tarefas", id), { status: newStatus });
    };

    window.deleteTask = async (id) => {
      if(confirm("Tem certeza que deseja excluir esta tarefa?")) {
        await deleteDoc(doc(db, "tarefas", id));
      }
    };

    window.editTask = (id) => {
      const task = tasks.find(t => t.id === id);
      if (!task) return;
      document.getElementById("taskId").value = task.id;
      document.getElementById("employeeInput").value = task.employee;
      document.getElementById("requestDateInput").value = task.requestDate;
      document.getElementById("deadlineInput").value = task.deadline;
      document.getElementById("clientInput").value = task.client;
      document.getElementById("serviceTypeInput").value = task.serviceType;
      document.getElementById("descriptionInput").value = task.description;
      document.getElementById("priorityInput").value = task.priority;
      document.getElementById("notesInput").value = task.notes || "";
      document.getElementById("modalTitle").textContent = "Editar serviço";
      document.getElementById("taskModal").classList.add("open");
    };

    // Modal Global Seguro
    window.openModal = () => {
      document.getElementById("taskForm").reset();
      document.getElementById("taskId").value = "";
      document.getElementById("requestDateInput").value = getToday();
      document.getElementById("modalTitle").textContent = "Novo serviço";
      document.getElementById("taskModal").classList.add("open");
    };

    document.getElementById("openModalBtn").addEventListener("click", window.openModal);
    document.getElementById("closeModalBtn").addEventListener("click", () => document.getElementById("taskModal").classList.remove("open"));

    // ENVIO DE FORMULÁRIO COM ANEXO REESCRITO E SEGURO
    document.getElementById("taskForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("saveTaskBtn");
      btn.disabled = true;

      try {
        const taskId = document.getElementById("taskId").value;
        const fileInput = document.getElementById("attachmentsInput");
        const files = fileInput.files;

        const payload = {
          employee: document.getElementById("employeeInput").value,
          requestDate: document.getElementById("requestDateInput").value,
          deadline: document.getElementById("deadlineInput").value,
          client: document.getElementById("clientInput").value,
          serviceType: document.getElementById("serviceTypeInput").value,
          description: document.getElementById("descriptionInput").value,
          priority: document.getElementById("priorityInput").value,
          notes: document.getElementById("notesInput").value,
        };

        if (taskId) {
          // EDITANDO SERVIÇO
          let newAttachments = [];
          if (files.length > 0) {
            btn.textContent = "Enviando anexos...";
            newAttachments = await uploadFilesToStorage(taskId, files);
          }
          const previousTask = tasks.find(t => t.id === taskId);
          const oldAttachments = previousTask.attachments || [];

          btn.textContent = "Atualizando serviço...";
          await updateDoc(doc(db, "tarefas", taskId), {
            ...payload,
            attachments: [...oldAttachments, ...newAttachments]
          });
          showToast("Serviço atualizado com sucesso!");
        } else {
          // CRIANDO NOVO SERVIÇO
          const newDocRef = doc(collection(db, "tarefas")); // 1. Gera o ID primeiro
          let newAttachments = [];
          
          if (files.length > 0) {
            btn.textContent = "Enviando anexos...";
            newAttachments = await uploadFilesToStorage(newDocRef.id, files); // 2. Envia os anexos
          }

          btn.textContent = "Gravando serviço...";
          await setDoc(newDocRef, { // 3. Salva no banco de dados
            ...payload,
            status: "pendente",
            attachments: newAttachments,
            createdAt: serverTimestamp(),
            createdBy: currentUser.email
          });
          showToast("Serviço criado com sucesso!");
        }

        document.getElementById("taskModal").classList.remove("open");
      } catch (error) {
        console.error(error);
        showToast("Erro ao salvar: " + error.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Salvar serviço";
      }
    });

    // Função de upload separada e limpa
    async function uploadFilesToStorage(taskId, files) {
      const anexos = [];
      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        // Cria um nome único e seguro para não substituir arquivos iguais
        const safeName = Date.now() + "_" + file.name.replace(/[^a-zA-Z0-9.\-_]/g, "");
        const fileRef = ref(storage, `tarefas/${taskId}/${safeName}`);
        
        await uploadBytes(fileRef, file); // Envia
        const url = await getDownloadURL(fileRef); // Pega o link
        
        anexos.push({ name: file.name, url: url });
      }
      return anexos;
    }
  </script>
</body>
